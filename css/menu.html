<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background-color: #ffffff;
}

.navbar {
    background-color: #ffffff;
    padding: 0;
    display: flex;
    align-items: center;
    min-height: 70px;
    position: relative;
    justify-content: space-between;
    max-width: 1200px;
    margin: auto;
    flex-direction: row;
}

.nav-brand {
  font-size: 20px;
  font-weight: bold;
  color: #2c3e50;
}

.nav-menu {
  display: flex;
  list-style: none;
  margin: 0;
  padding: 0;
  align-items: center;
}

.nav-item {
  position: relative;
}

.nav-link {font-family: Poppins, sans-serif;
  display: block;
  padding: 15px 16px;
  color:#272727;
  text-decoration: none;
  font-size: 16px;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  border: none;
  background: none;
  cursor: pointer;
}

.nav-link:hover {
  color:#536e87;
}

.dropdown-content {
  position: absolute;
  top: 100%;
  left: 0;
  background-color: #ffffff;
  min-width: 220px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
  border-radius: 8px;
  border: 1px solid #e2e8f0;
  opacity: 0;
  visibility: hidden;
  transform: translateY(-10px);
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 1000;
  margin-top: 5px;
}

.dropdown:hover .dropdown-content {
  opacity: 1;
  visibility: visible;
}

.dropdown-item {
  display: block;
  padding: 15px 25px;
  color:#272727;
  text-decoration: none;
  font-size: 15px;
  transition: all 0.2s ease;
}

.dropdown-item:last-child {
  border-bottom: none;
  border-radius: 0 0 8px 8px;
}

.dropdown-item:first-child {
  border-radius: 8px 8px 0 0;
}

.dropdown-item:hover {
  color:#536e87;
  background-color: #f7fafc;
}

.hamburger {
  display: none;
  flex-direction: column;
  cursor: pointer;
  margin-left: auto;
  z-index: 1001;
}

.hamburger span {
  width: 25px;
  height: 3px;
  background-color:#272727;
  margin: 3px 0;
  transition: 0.3s;
}

.external-link::after {
  content: "↗";
  margin-left: 5px;
  font-size: 12px;
  opacity: 0.7;
}

/* Mobile Styles */
@media screen and (max-width: 768px) {
  .navbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    max-width: none;
    width: 100%;
  }

  .nav-menu {
    position: fixed;
    left: -100%;
    top: 0;
    flex-direction: column;
    background-color: #ffffff;
    width: 100vw;
    height: 100vh;
    text-align: left;
    transition: left 0.3s ease;
    box-shadow: 0 10px 27px rgba(0, 0, 0, 0.05);
    align-items: stretch;
    padding-top: 80px;
    overflow-y: auto;
    z-index: 999;
  }

  .nav-menu.active {
    left: 0;
  }

  .nav-item {
    width: 100%;
  }

  .nav-link {
    padding: 20px 30px;
    border-bottom: 1px solid #f7fafc;
    transform: none !important;
    font-size: 18px;
  }

  .dropdown-content {
    position: static;
    opacity: 1;
    visibility: visible;
    transform: none;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
    border: none;
    border-radius: 0;
    margin: 0;
    background-color: #f8fafc;
    display: none;
  }

  .dropdown-content.show {
    display: block;
  }

  .dropdown-item {
    padding: 15px 50px;
    border-bottom: 1px solid #e2e8f0;
    transform: none !important;
    font-size: 16px;
  }

  .hamburger {
    display: flex;
  }

  .hamburger.active span:nth-child(2) {
    opacity: 0;
  }

  .hamburger.active span:nth-child(1) {
    transform: translateY(9px) rotate(45deg);
  }

  .hamburger.active span:nth-child(3) {
    transform: translateY(-9px) rotate(-45deg);
  }

  /* Add padding to body to account for fixed navbar */
  body {
    padding-top: 70px;
  }
}
</style>
</head>
<body>

<nav class="navbar">
  <div class="nav-brand"><img src="https://vici.network/wp-content/uploads/2025/03/ViciNetwork_logo_350x74.png" alt="Vici Network" style="max-width:176px;"></div>
  
  <ul class="nav-menu" id="nav-menu">
    
    <li class="nav-item dropdown">
      <button class="nav-link">Products <i class="fa fa-caret-down"></i></button>
      <div class="dropdown-content">
        <a href="https://vici.network/new-menu-test/#StableCoin-Platform" class="dropdown-item">StableCoin Platform</a>
        <a href="https://vici.network/new-menu-test/#ViciCoin" class="dropdown-item">ViciCoin</a>
        <a href="https://vici.network/new-menu-test/#Fractional-RWA " class="dropdown-item">RWAssetShare</a>
        <a href="https://vici.network/new-menu-test/#ViciWallet" class="dropdown-item">ViciWallet</a>
        <a href="https://vici.network/new-menu-test/#ViciSwap" class="dropdown-item">ViciSwap</a>
      </div>
    </li>
    
    <li class="nav-item dropdown">
      <button class="nav-link">Platform <i class="fa fa-caret-down"></i></button>
      <div class="dropdown-content">
        <a href="#software" class="dropdown-item">Smart Contract Suite</a>
        <a href="#apps" class="dropdown-item">Token Security Gates</a>
        <a href="#templates" class="dropdown-item">SyncroBots</a>
        <a href="#tools" class="dropdown-item">Exchange Management</a>
        <a href="#software" class="dropdown-item">Slingshot</a>
        <a href="#apps" class="dropdown-item">RAMS</a>
        <a href="#templates" class="dropdown-item">BI, Operations & Reporting</a>    
      </div>
    </li>
    
    <li class="nav-item">
      <a href="https://vicicoin.io/" target="_blank" class="nav-link">Drops</a>
    </li>

        <li class="nav-item">
      <a href="https://vicicoin.io/" target="_blank" class="nav-link">News</a>
    </li>

    <li class="nav-item">
      <a href="https://vicicoin.io/" target="_blank" class="nav-link external-link">ViciCoin.io</a>
    </li>
    
    <li class="nav-item">
      <a href="https://viciswap.io/" target="_blank" class="nav-link external-link">ViciSwap.io</a>
    </li>
  </ul>
  
  <div class="hamburger" id="hamburger">
    <span></span>
    <span></span>
    <span></span>
  </div>
</nav>



<script>
const hamburger = document.getElementById('hamburger');
const navMenu = document.getElementById('nav-menu');

hamburger.addEventListener('click', function() {
  hamburger.classList.toggle('active');
  navMenu.classList.toggle('active');
});

// Handle dropdown clicks on mobile
document.querySelectorAll('.dropdown .nav-link').forEach(button => {
  button.addEventListener('click', function(e) {
    if (window.innerWidth <= 768) {
      e.preventDefault();
      const dropdown = this.nextElementSibling;
      
      // Close other dropdowns
      document.querySelectorAll('.dropdown-content').forEach(content => {
        if (content !== dropdown) {
          content.classList.remove('show');
        }
      });
      
      dropdown.classList.toggle('show');
    }
  });
});

// Close mobile menu when clicking on any link (including anchor links)
document.querySelectorAll('.nav-link, .dropdown-item').forEach(link => {
  link.addEventListener('click', function(e) {
    if (window.innerWidth <= 768) {
      // Check if it's not a dropdown button
      if (!this.classList.contains('nav-link') || this.getAttribute('href')) {
        // Close the mobile menu
        hamburger.classList.remove('active');
        navMenu.classList.remove('active');
        
        // Close any open dropdowns
        document.querySelectorAll('.dropdown-content').forEach(content => {
          content.classList.remove('show');
        });
      }
    }
  });
});

// Close mobile menu when clicking outside
document.addEventListener('click', function(e) {
  if (!hamburger.contains(e.target) && !navMenu.contains(e.target)) {
    hamburger.classList.remove('active');
    navMenu.classList.remove('active');
    document.querySelectorAll('.dropdown-content').forEach(content => {
      content.classList.remove('show');
    });
  }
});

// Reset on window resize
window.addEventListener('resize', function() {
  if (window.innerWidth > 768) {
    hamburger.classList.remove('active');
    navMenu.classList.remove('active');
    document.querySelectorAll('.dropdown-content').forEach(content => {
      content.classList.remove('show');
    });
  }
});
</script>

</body>
</html>
